name: navithera_client
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+13

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  liquid_swipe: ^3.1.0
  smooth_page_indicator: ^1.1.0
  video_player: ^2.8.3

  # LiveKit for video calls
  livekit_client: ^2.5.4
  crypto: ^3.0.3
  dart_jsonwebtoken: ^3.3.1
  permission_handler: ^11.3.1

  # State Management
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  dartz: ^0.10.1

  # Network & API
  dio: ^5.4.1
  google_fonts: ^6.2.1
  flutter_background: ^1.3.0+1
  dropdown_button2: ^2.3.9
  shared_preferences: ^2.5.3
  retrofit: ^4.1.0
  audioplayers: ^6.5.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  http: ^1.4.0
  googleapis_auth: ^2.0.0
  flutter_dotenv: ^5.2.1
  overlay_support: ^2.1.0

  flutter_localizations:
    sdk: flutter
  numberpicker: ^2.1.2
  lottie: ^3.3.1
  socket_io_client: ^3.1.2
  image_picker: ^1.2.0
  table_calendar: ^3.1.3
  flutter_native_splash: ^2.4.6
  file_picker: ^10.3.3
  photo_view: ^0.15.0
  flutter_callkit_incoming: ^3.0.0
  url_launcher: ^6.3.2
  flutter_linkify: ^6.0.0
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  retrofit_generator: 9.2.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/avatars/
    - assets/sounds/
    - assets/animations/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
